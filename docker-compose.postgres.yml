# Netronome Docker Compose 配置文件（PostgreSQL 版本）
# 使用此文件可以部署带有 PostgreSQL 数据库的 Netronome 应用，提供更好的性能

services:
  # Netronome 主服务
  netronome:
    # 使用最新版本的 Netronome 镜像
    image: ghcr.io/autobrr/netronome:latest
    # 设置容器名称
    container_name: netronome
    # 端口映射：将主机的 7575 端口映射到容器的 7575 端口
    ports:
      - "7575:7575"
    # 卷挂载：将主机的 ./netronome 目录挂载到容器的 /data 目录
    # 用于持久化存储配置文件
    volumes:
      - ./netronome:/data
    # 添加网络原始访问权限，用于 MTR 和特权 ping 操作
    cap_add:
      - NET_RAW # 用于 MTR 和特权 ping 操作的必要权限
    # 环境变量配置
    environment:
      - NETRONOME__DB_TYPE=postgres        # 使用 PostgreSQL 数据库
      - NETRONOME__DB_HOST=postgres         # 数据库主机名（与 PostgreSQL 服务名称一致）
      - NETRONOME__DB_PORT=5432             # 数据库端口
      - NETRONOME__DB_USER=netronome        # 数据库用户名
      - NETRONOME__DB_PASSWORD=netronome    # 数据库密码
      - NETRONOME__DB_NAME=netronome        # 数据库名称
      - NETRONOME__DB_SSLMODE=disable       # 禁用 SSL 连接（开发环境使用）
    # 依赖关系：等待 PostgreSQL 服务启动后再启动
    depends_on:
      - postgres
    # 重启策略：除非手动停止，否则容器退出时自动重启
    restart: unless-stopped

  # PostgreSQL 数据库服务
  postgres:
    # 设置容器名称
    container_name: netronome-postgres
    # 使用 PostgreSQL 17 Alpine 镜像（轻量级版本）
    image: postgres:17-alpine
    # 环境变量配置
    environment:
      - POSTGRES_USER=netronome        # PostgreSQL 用户名
      - POSTGRES_PASSWORD=netronome    # PostgreSQL 密码
      - POSTGRES_DB=netronome          # 初始化的数据库名称
    # 卷挂载：使用命名卷存储 PostgreSQL 数据
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 端口映射：将主机的 5432 端口映射到容器的 5432 端口（可选，用于外部连接）
    ports:
      - "5432:5432"
    # 健康检查：确保数据库服务正常运行
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netronome"]  # 检查数据库是否就绪
      interval: 5s                                     # 检查间隔时间
      timeout: 5s                                      # 检查超时时间
      retries: 5                                       # 重试次数
    # 重启策略：除非手动停止，否则容器退出时自动重启
    restart: unless-stopped

# 定义命名卷，用于持久化 PostgreSQL 数据
volumes:
  postgres_data: